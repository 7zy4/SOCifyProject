[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers -m 'not e2e'"
markers = ["e2e: browser end-to-end tests", "performance: deterministic local benchmark tests"]

[tool.coverage.run]
branch = true
source = ["socify"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 90

[tool.ruff]
target-version = "py311"
line-length = 160
exclude = ["add_sample_data.py", "quick_data.py", "quick_fix_data.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP", "SIM"]
ignore = ["E501", "S101", "S608"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
exclude = "^(add_sample_data|quick_data|quick_fix_data)\\.py$"

[tool.bandit]
skips = ["B608"]
