name: Enterprise Quality Gates

on:
  pull_request:
  push:
    branches:
      - socify-version-2
      - socify-version-3

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m ruff format --check .
      - run: python -m ruff check .
      - run: python -m mypy socify scripts app.py create_db.py init_db.py run.py
      - run: python -m scripts.generate_openapi
      - run: git diff --exit-code docs/api/openapi.yaml
      - uses: ./.github/actions/analysis-backend
      - run: python -m pytest -q --cov=socify --cov-branch --cov-report=xml --cov-fail-under=90
      - run: sudo apt-get update && sudo apt-get install --yes poppler-utils
      - name: Validate long bilingual report with the isolated native renderer
        run: |
          python -m tests.container.verify_report_layout --output "$RUNNER_TEMP/socify-long-report"
          pdftotext -bbox-layout "$RUNNER_TEMP/socify-long-report/long-report.pdf" "$RUNNER_TEMP/socify-long-report/bbox.xml"
          python -m tests.container.verify_report_layout --output "$RUNNER_TEMP/socify-long-report" --bbox "$RUNNER_TEMP/socify-long-report/bbox.xml"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coverage
          path: coverage.xml
      - if: always()
        run: docker rm --force socify-ci-analysis
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m bandit -c pyproject.toml -r socify scripts app.py create_db.py init_db.py run.py
      - run: python -m pip_audit -r requirements.txt
      - run: git ls-files -z | xargs -0 detect-secrets-hook -c 1 --baseline .secrets.baseline --exclude-files '^(data/enterprise-attack-v20.0.json|fixtures/windows/sysmon-sample.evtx.b64)$'
      - run: cyclonedx-py requirements requirements.txt --output-reproducible --of JSON -o sbom.json
      - run: pip-licenses --format=json --with-urls --output-file=licenses.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: supply-chain-evidence
          path: |
            sbom.json
            licenses.json
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/dependency-review-action@3c4e3dcb1aa7874d2c16be7d79418e9b7efd6261
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: npm install --no-save --ignore-scripts axe-core@4.14.0
      - uses: ./.github/actions/analysis-backend
      - run: xvfb-run --auto-servernum --server-args="-screen 0 1600x1200x24" python -m pytest -m e2e tests/e2e --junitxml=artifacts/browser-junit.xml
      - name: Publish browser failure details in the job summary
        if: always()
        run: |
          python - <<'PY'
          import html
          import os
          from pathlib import Path

          report = Path("artifacts/browser-junit.xml")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("## Browser acceptance\n\n")
              if not report.is_file():
                  summary.write("The browser test runner did not produce a JUnit report. Inspect the preceding setup step.\n")
              else:
                  from defusedxml import ElementTree

                  root = ElementTree.parse(report).getroot()
                  for suite in root.iter("testsuite"):
                      summary.write(f"Tests: {suite.get('tests')}; failures: {suite.get('failures')}; errors: {suite.get('errors')}; skipped: {suite.get('skipped')}\n\n")
                  for case in root.iter("testcase"):
                      for failure in (*case.findall("failure"), *case.findall("error")):
                          name = html.escape(f"{case.get('classname')}.{case.get('name')}")
                          message = html.escape(failure.get("message", "")[:4000])
                          summary.write(f"<h3>{name}</h3><pre>{message}</pre>\n")
                          annotation = f"{case.get('classname')}.{case.get('name')}: {failure.get('message', '')[:2000]}"
                          annotation = annotation.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                          print(f"::error title=Browser acceptance failure::{annotation}")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: browser-results
          path: artifacts/browser-junit.xml
      - if: always()
        run: docker rm --force socify-ci-analysis
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Generate ephemeral keys for every container step
        run: |
          python - <<'PY'
          import os
          import secrets

          with open(os.environ["GITHUB_ENV"], "a") as environment:
              for name in ("SOCIFY_SECRET_KEY", "SOCIFY_CREDENTIAL_KEY"):
                  value = secrets.token_urlsafe(48)
                  print(f"::add-mask::{value}")
                  environment.write(f"{name}={value}\n")
          PY
      - run: docker compose up --detach --build
      - run: curl --fail --retry 20 --retry-delay 2 --retry-all-errors http://127.0.0.1:5000/health/ready
      - run: docker compose exec -T -e SOCIFY_CONTAINER_ACCEPTANCE=synthetic socify python - < tests/container/verify_autopsy.py
      - run: docker compose ps --status running --services | grep --fixed-strings --line-regexp autopsy-worker
      - run: docker compose ps --status running --services | grep --fixed-strings --line-regexp import-worker
      - run: docker compose ps --status running --services | grep --fixed-strings --line-regexp analysis
      - if: always()
        run: docker compose logs
      - if: always()
        run: docker compose down --volumes
  performance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m scripts.benchmark_reference
      - uses: ./.github/actions/analysis-backend
      - run: python -m scripts.benchmark_autopsy --events 1000000 --concurrency 20 --requests 100 --output artifacts/performance-autopsy.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: performance-reference
          path: artifacts/performance-reference.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: performance-autopsy
          path: artifacts/performance-autopsy.json
      - if: always()
        run: docker rm --force socify-ci-analysis
