name: Enterprise Quality Gates

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - final
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - 'docs/**'

permissions:
  contents: read

# A newer push to the same branch or tag replaces the run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      - run: python -m ruff format --check .
      - run: python -m ruff check .
      - name: Validate Bash launchers
        run: |
          bash -n scripts/start_analysis.sh
          bash -n scripts/try_codespace.sh
          bash -n scripts/try_demo.sh
      - run: python -m mypy socify scripts tools app.py run.py
      - run: python -m tools.generate_interface_tokens --check
      - run: python -m tools.audit_brand --tokens-only
      - run: python -m tools.generate_openapi
      - run: git diff --exit-code docs/api/openapi.yaml
      - uses: ./.github/actions/analysis-backend
      - run: python -m pytest -q --cov=socify --cov-branch --cov-report=xml --cov-report=term-missing --cov-fail-under=90 --junitxml=artifacts/quality-junit.xml
      - name: Publish unit and integration failure details
        if: always()
        run: python -m tools.junit_summary artifacts/quality-junit.xml "Unit and integration tests" --coverage coverage.xml
      - run: sudo apt-get update && sudo apt-get install --yes poppler-utils
      - name: Validate long bilingual report with the isolated native renderer
        run: |
          python -m tests.container.verify_report_layout --output "$RUNNER_TEMP/socify-long-report"
          pdftotext -bbox-layout "$RUNNER_TEMP/socify-long-report/long-report.pdf" "$RUNNER_TEMP/socify-long-report/bbox.xml"
          python -m tests.container.verify_report_layout --output "$RUNNER_TEMP/socify-long-report" --bbox "$RUNNER_TEMP/socify-long-report/bbox.xml"
          pdftoppm -png -scale-to 1400 "$RUNNER_TEMP/socify-long-report/long-report.pdf" "$RUNNER_TEMP/socify-long-report/page"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: report-layout
          path: |
            ${{ runner.temp }}/socify-long-report/manifest.json
            ${{ runner.temp }}/socify-long-report/long-report.pdf
            ${{ runner.temp }}/socify-long-report/page-*.png
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: coverage
          path: coverage.xml
      - if: always()
        run: docker rm --force socify-ci-analysis
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      - run: python -m bandit -c pyproject.toml -r socify scripts tools app.py run.py
      - run: python -m pip_audit -r requirements.txt
      - run: git ls-files -z | xargs -0 detect-secrets-hook -c 1 --baseline .secrets.baseline --exclude-files '^(data/enterprise-attack-v20.0.json|fixtures/windows/sysmon-sample.evtx.b64)$'
      - name: Generate the SBOM with a tool kept apart from the tested environment
        # cyclonedx-bom needs a newer cyclonedx-python-lib than pip-audit allows, so it has its own lock and virtual environment.
        run: |
          python -m venv "$RUNNER_TEMP/sbom"
          "$RUNNER_TEMP/sbom/bin/python" -m pip install --require-hashes -r requirements-audit.txt
          "$RUNNER_TEMP/sbom/bin/cyclonedx-py" requirements requirements.txt --output-reproducible --of JSON -o sbom.json
      - run: pip-licenses --format=json --with-urls --output-file=licenses.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: supply-chain-evidence
          path: |
            sbom.json
            licenses.json
  browser:
    name: browser (${{ matrix.shard }}/8)
    # Playwright 1.55 supports this image; ubuntu-latest has moved to 26.04.
    runs-on: ubuntu-24.04
    # The suite takes over three hours in one job; eight shards finish in about half an hour (tests/conftest.py).
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install --yes poppler-utils
      - run: npm install --no-save --ignore-scripts axe-core@4.14.0
      - uses: ./.github/actions/analysis-backend
      # The two native report suites run in the native-decisions jobs below, so the shards skip them.
      - run: >-
          xvfb-run --auto-servernum --server-args="-screen 0 1600x1200x24"
          python -m pytest -m e2e tests/e2e
          --ignore=tests/e2e/test_native_delivery_decisions.py
          --ignore=tests/e2e/test_native_completion_decisions.py
          --junitxml=artifacts/browser-junit.xml
        env:
          SOCIFY_TEST_SHARD: ${{ matrix.shard }}/8
      - name: Audit operational pages in both languages, editions and viewport sizes
        if: matrix.shard == 1
        run: python -m tools.audit_brand
      - name: Publish browser failure details in the job summary
        if: always()
        run: python -m tools.junit_summary artifacts/browser-junit.xml "Browser acceptance ${{ matrix.shard }}/8"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: browser-results-${{ matrix.shard }}
          path: |
            artifacts/browser-junit.xml
            artifacts/brand/
            artifacts/soc-insights/
            artifacts/review-journeys/
            artifacts/performance-charts/
            artifacts/interface-interactions/
            artifacts/interface-final-review/
            artifacts/interaction-final-review/
            artifacts/usability_campaign/performance-decision-review/
            artifacts/usability_campaign/performance-access-review/
            artifacts/usability_campaign/source-transport-decisions/
            artifacts/usability_campaign/blue-team-decisions/
            artifacts/usability_campaign/shift-lead-decisions/
            artifacts/usability_campaign/calendar-decisions/
            artifacts/usability_campaign/scope-continuity-decisions/
            artifacts/usability_campaign/source-provider-decisions/
            artifacts/usability_campaign/followup-decisions/
            artifacts/usability_campaign/geoip-context-decisions/
            artifacts/usability_campaign/reputation-decisions/
            artifacts/usability_campaign/evidence-interpretation-decisions/
            artifacts/usability_campaign/occurrence-user-decisions/
            artifacts/usability_campaign/import-mapping-decisions/
            artifacts/usability_campaign/blind-review/alert-repair/
            artifacts/usability_campaign/blind-review/alert-details/
            artifacts/usability_campaign/blind-review/assessment-repair/browser/
            artifacts/usability_campaign/ci-assessment-current/alert-review-independent/after/
            work/interface-review/
      - if: always()
        run: docker rm --force socify-ci-analysis
  native-decisions:
    name: Native evidence decisions (${{ matrix.suite }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        suite: [delivery, completion]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install --yes poppler-utils
      - run: npm install --no-save --ignore-scripts axe-core@4.14.0
      - uses: ./.github/actions/analysis-backend
      - name: Read actual native reports before review and subsequent case decisions
        env:
          DECISION_SUITE: ${{ matrix.suite }}
        run: >-
          xvfb-run --auto-servernum --server-args="-screen 0 1600x1200x24"
          python -m pytest -m e2e "tests/e2e/test_native_${DECISION_SUITE}_decisions.py"
          "--junitxml=artifacts/native-${DECISION_SUITE}-junit.xml"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: native-${{ matrix.suite }}-decisions
          path: |
            artifacts/native-${{ matrix.suite }}-junit.xml
            artifacts/usability_campaign/native-${{ matrix.suite }}-decisions/
      - if: always()
        run: docker rm --force socify-ci-analysis
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Generate ephemeral keys for every container step
        run: |
          python - <<'PY'
          import os
          import secrets

          with open(os.environ["GITHUB_ENV"], "a") as environment:
              for name in ("SOCIFY_SECRET_KEY", "SOCIFY_CREDENTIAL_KEY"):
                  value = secrets.token_urlsafe(48)
                  print(f"::add-mask::{value}")
                  environment.write(f"{name}={value}\n")
          PY
      # --wait returns once every service reports healthy, and fails if one becomes unhealthy or exits.
      - run: docker compose up --detach --build --wait --wait-timeout 300
      - run: curl --fail --retry 20 --retry-delay 2 --retry-all-errors http://127.0.0.1:5000/health/ready
      - run: docker compose exec -T -e SOCIFY_CONTAINER_ACCEPTANCE=synthetic socify python - < tests/container/verify_autopsy.py
      - run: docker compose ps --status running --services | grep --fixed-strings --line-regexp autopsy-worker
      - run: docker compose ps --status running --services | grep --fixed-strings --line-regexp import-worker
      - run: docker compose ps --status running --services | grep --fixed-strings --line-regexp analysis
      - name: Every service still reports healthy after the acceptance run
        run: |
          docker compose ps --format '{{.Service}} {{.Health}}'
          test -z "$(docker compose ps --format '{{.Service}} {{.Health}}' | grep -v ' healthy$')"
      - if: always()
        run: docker compose logs
      - if: always()
        run: docker compose down --volumes
  performance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install --require-hashes -r requirements.txt
      - uses: ./.github/actions/analysis-backend
      - run: python -m tools.benchmark_autopsy --events 1000000 --concurrency 20 --requests 100 --output artifacts/performance-autopsy.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: performance-autopsy
          path: artifacts/performance-autopsy.json
      - if: always()
        run: docker rm --force socify-ci-analysis
