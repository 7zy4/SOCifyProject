name: Phase One Tests
on:
  push:
    branches: [feature/phase-1-security-detection-incidents]
  pull_request:
    branches: [main]
jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
        env:
          SOCIFY_SECRET_KEY: ci-only-test-secret
