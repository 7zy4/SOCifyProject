<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="csrf-token" content="{{ csrf_token() }}">
<title>التحقيقات الأمنية - SOCify</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<style>
body{background:#101827;color:#eef2ff;font-family:Tahoma,Arial,sans-serif;margin:0}
main{max-width:1100px;margin:2rem auto;padding:0 1rem}
header{display:flex;justify-content:space-between;align-items:center;gap:1rem}
a{color:#72d0ff} button,select,input,textarea{font:inherit;border-radius:7px;padding:.7rem}
button{background:#1677bd;color:white;border:0;cursor:pointer}
input,select,textarea{background:#19263b;color:#fff;border:1px solid #576980}
fieldset,.case{background:#1c2a40;border:1px solid #384b62;border-radius:12px;padding:1rem;margin:1rem 0}
form{display:grid;gap:.8rem}.cases{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1rem}
.case{cursor:pointer}.muted{color:#b3c6dc} .error{color:#ffb5b5}
label{display:grid;gap:.3rem}button:disabled{opacity:.55}
</style></head>
<body>
<main>
<header><h1>التحقيقات الأمنية - Incident Cases</h1><a href="/dashboard">لوحة التحكم</a></header>
<p>افتح تحقيقًا، اربط الأحداث الأمنية، أضف أدلة وملاحظات، وتابع حالة الاستجابة.</p>
<fieldset><legend>تحقيق جديد</legend>
<form id="new-case">
<label>عنوان التحقيق <input name="title" required maxlength="255"></label>
<label>الوصف <textarea name="description"></textarea></label>
<label>الخطورة <select name="severity"><option value="medium">متوسط</option><option value="low">منخفض</option><option value="high">مرتفع</option><option value="critical">حرج</option></select></label>
<label>أرقام الأحداث المرتبطة (مثال 1,2,3) <input name="event_ids" placeholder="1,2,3"></label>
<button type="submit">إنشاء التحقيق</button>
</form></fieldset>
<p id="message" role="status"></p>
<h2>التحقيقات</h2><section class="cases" id="cases"></section>
<section id="details" hidden>
<h2 id="case-title"></h2><p id="case-description"></p><p id="case-events"></p>
<label>الحالة <select id="case-status"><option value="open">مفتوح</option><option value="investigating">قيد التحقيق</option><option value="resolved">مغلق</option><option value="false_positive">إنذار كاذب</option></select></label>
<button id="save-status">حفظ الحالة</button>
<h3>الأدلة والأحداث</h3><div id="case-evidence"></div>
<form id="attach-event"><label>ربط حدث إضافي <input name="event_id" type="number" min="1" required></label><button>ربط الحدث</button></form>
<h3>ملاحظات التحقيق</h3><div id="case-notes"></div>
<form id="new-note"><label>ملاحظة جديدة <textarea name="note" required maxlength="10000"></textarea></label><button>إضافة الملاحظة</button></form>
</section>
</main>
<script>
const token=document.querySelector('meta[name="csrf-token"]').content;
let selected=null;
const message=document.getElementById('message');
const statusNames={open:'مفتوح',investigating:'قيد التحقيق',resolved:'مغلق',false_positive:'إنذار كاذب'};
const request=async(path,method='GET',body)=>{
const response=await fetch(path,{method,headers:{'Content-Type':'application/json','X-CSRFToken':token},body:body?JSON.stringify(body):undefined});
const result=await response.json();
if(!response.ok)throw Error(result.error||'تعذّر تنفيذ العملية');
return result;
};
function notify(text,error=false){message.textContent=text;message.className=error?'error':'muted';}
const node=(tag,text)=>{const el=document.createElement(tag);el.textContent=String(text??'');return el;};
async function reload(){
try{const cases=await request('/api/incidents');const list=document.getElementById('cases');list.replaceChildren();
for(const item of cases){const card=document.createElement('article');card.className='case';
card.append(node('h3',item.title),node('p','الخطورة: '+item.severity+' | الحالة: '+(statusNames[item.status]||item.status)),
node('p','عدد الأحداث: '+item.event_count+' | المسؤول: '+(item.assigned_to_name||'غير معيّن')));
card.tabIndex=0;card.setAttribute('role','button');card.onclick=()=>openCase(item.id);
card.onkeydown=e=>{if(e.key==='Enter')openCase(item.id)};list.append(card)}
if(!cases.length)list.append(node('p','لا توجد تحقيقات بعد.'))}
catch(e){notify(e.message,true)}
}
async function openCase(id){
try{selected=id;const data=await request('/api/incidents/'+id);const item=data.incident;
document.getElementById('details').hidden=false;
document.getElementById('case-title').textContent=item.title;
document.getElementById('case-description').textContent=item.description||'';
document.getElementById('case-status').value=item.status;
const evidence=document.getElementById('case-evidence');evidence.replaceChildren();
for(const event of data.events)evidence.append(node('p','#'+event.id+' - '+event.title+' ('+event.severity+')'));
if(!data.events.length)evidence.append(node('p','لم يتم ربط أحداث بعد.'));
const notes=document.getElementById('case-notes');notes.replaceChildren();
for(const note of data.notes)notes.append(node('p',(note.author||'محلل')+': '+note.note));
document.getElementById('details').scrollIntoView({behavior:'smooth'});}
catch(e){notify(e.message,true)}
}
document.getElementById('new-case').onsubmit=async e=>{
e.preventDefault();const data=new FormData(e.target);
const raw=(data.get('event_ids')||'').trim();
const ids=raw?raw.split(',').map(x=>Number(x.trim())):[];
if(ids.some(x=>!Number.isSafeInteger(x)||x<1)){notify('أرقام الأحداث غير صالحة',true);return}
try{const r=await request('/api/incidents','POST',{title:data.get('title'),description:data.get('description'),severity:data.get('severity'),event_ids:ids});
e.target.reset();notify('تم فتح التحقيق #'+r.id);await reload();await openCase(r.id)}
catch(err){notify(err.message,true)}
};
document.getElementById('save-status').onclick=async()=>{
if(!selected)return;try{await request('/api/incidents/'+selected,'PATCH',{status:document.getElementById('case-status').value});notify('تم تحديث الحالة');await reload();await openCase(selected)}catch(e){notify(e.message,true)}
};
document.getElementById('new-note').onsubmit=async e=>{
e.preventDefault();if(!selected)return;try{const note=new FormData(e.target).get('note');await request('/api/incidents/'+selected+'/notes','POST',{note});e.target.reset();notify('أُضيفت الملاحظة');await openCase(selected)}catch(err){notify(err.message,true)}
};
document.getElementById('attach-event').onsubmit=async e=>{
e.preventDefault();if(!selected)return;try{const event_id=Number(new FormData(e.target).get('event_id'));await request('/api/incidents/'+selected+'/events','POST',{event_id});e.target.reset();notify('تم ربط الحدث');await openCase(selected);await reload()}catch(err){notify(err.message,true)}
};
reload();
</script>
</body></html>
