services:
  ingress:
    build:
      context: .
      target: ingress
    depends_on:
      socify:
        condition: service_healthy
    ports:
      - "127.0.0.1:${SOCIFY_HTTP_PORT:-5000}:5000"
    networks:
      - socify-internal
      - ingress
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 128m
    cpus: 1
    pids_limit: 64
    restart: unless-stopped
  socify:
    depends_on:
      analysis:
        condition: service_healthy
    build:
      context: .
      target: runtime
    environment:
      SOCIFY_ENV: production
      SOCIFY_SECRET_KEY: ${SOCIFY_SECRET_KEY:?Set SOCIFY_SECRET_KEY to a random value of at least 32 bytes}
      SOCIFY_CREDENTIAL_KEY: ${SOCIFY_CREDENTIAL_KEY:?Set SOCIFY_CREDENTIAL_KEY to a separate random value}
      SOCIFY_CREDENTIAL_KEY_PREVIOUS: ${SOCIFY_CREDENTIAL_KEY_PREVIOUS:-}
      SOCIFY_METRICS_TOKEN: ${SOCIFY_METRICS_TOKEN:-}
      SOCIFY_DATABASE: /data/socify.db
      SOCIFY_HTTPS: "0"
      SOCIFY_TRUSTED_HOSTS: localhost,127.0.0.1
      SOCIFY_TRUSTED_PROXIES: "1"
      SOCIFY_ANALYSIS_SOCKET: /analysis-ipc/analysis.sock
    networks:
      - socify-internal
    mem_limit: 1g
    cpus: 2
    pids_limit: 128
    volumes:
      - socify-data:/data
      - analysis-ipc:/analysis-ipc:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
  autopsy-worker:
    depends_on:
      socify:
        condition: service_healthy
    init: true
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "python", "-m", "scripts.healthcheck", "worker", "--name", "autopsy-worker", "--max-age", "120"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 5s
    build:
      context: .
      target: runtime
    command: ["python", "-m", "scripts.run_autopsy_worker"]
    environment:
      SOCIFY_ENV: production
      SOCIFY_SECRET_KEY: ${SOCIFY_SECRET_KEY:?Set SOCIFY_SECRET_KEY to a random value of at least 32 bytes}
      SOCIFY_CREDENTIAL_KEY: ${SOCIFY_CREDENTIAL_KEY:?Set SOCIFY_CREDENTIAL_KEY to a separate random value}
      SOCIFY_CREDENTIAL_KEY_PREVIOUS: ${SOCIFY_CREDENTIAL_KEY_PREVIOUS:-}
      SOCIFY_DATABASE: /data/socify.db
      SOCIFY_ANALYSIS_SOCKET: /analysis-ipc/analysis.sock
    network_mode: none
    mem_limit: 2g
    cpus: 2
    pids_limit: 64
    volumes:
      - socify-data:/data
      - analysis-ipc:/analysis-ipc:ro
    read_only: true
    tmpfs:
      - /tmp:size=128m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
  analysis:
    init: true
    healthcheck:
      test: ["CMD", "python", "-m", "scripts.healthcheck", "analysis"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 5s
    build:
      context: .
      target: analysis
    command: ["python", "-m", "scripts.run_analysis_service"]
    environment:
      SOCIFY_ISOLATED_ANALYSIS_CONTAINER: "1"
    network_mode: none
    mem_limit: 2g
    cpus: 2
    pids_limit: 32
    volumes:
      - analysis-ipc:/analysis-ipc
    read_only: true
    tmpfs:
      - /tmp:size=128m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
  import-worker:
    depends_on:
      socify:
        condition: service_healthy
    init: true
    healthcheck:
      test: ["CMD", "python", "-m", "scripts.healthcheck", "worker", "--name", "import-worker", "--max-age", "120"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 5s
    build:
      context: .
      target: runtime
    command: ["python", "-m", "scripts.run_import_worker", "--lease-seconds", "120"]
    network_mode: none
    mem_limit: 1g
    cpus: 2
    pids_limit: 64
    environment:
      SOCIFY_ENV: production
      SOCIFY_SECRET_KEY: ${SOCIFY_SECRET_KEY:?Set SOCIFY_SECRET_KEY to a random value of at least 32 bytes}
      SOCIFY_CREDENTIAL_KEY: ${SOCIFY_CREDENTIAL_KEY:?Set SOCIFY_CREDENTIAL_KEY to a separate random value}
      SOCIFY_CREDENTIAL_KEY_PREVIOUS: ${SOCIFY_CREDENTIAL_KEY_PREVIOUS:-}
      SOCIFY_DATABASE: /data/socify.db
    volumes:
      - socify-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
  backup:
    depends_on:
      socify:
        condition: service_healthy
    init: true
    healthcheck:
      test: ["CMD", "python", "-m", "scripts.healthcheck", "worker", "--name", "backup", "--max-age", "120"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 5s
    build:
      context: .
      target: runtime
    command: ["python", "-m", "scripts.backup_scheduler"]
    # No credential key and no network: the service copies the database file and never reads encrypted values.
    environment:
      SOCIFY_DATABASE: /data/socify.db
      SOCIFY_BACKUP_DIR: /backups
      SOCIFY_BACKUP_INTERVAL_HOURS: ${SOCIFY_BACKUP_INTERVAL_HOURS:-24}
      SOCIFY_BACKUP_KEEP: ${SOCIFY_BACKUP_KEEP:-14}
      SOCIFY_BACKUP_KEY: ${SOCIFY_BACKUP_KEY:-}
    network_mode: none
    mem_limit: 512m
    cpus: 1
    pids_limit: 32
    volumes:
      # Read-write because SQLite needs the -shm file to read a database in WAL mode.
      - socify-data:/data
      - socify-backups:/backups
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

volumes:
  socify-data:
  socify-backups:
  analysis-ipc:

networks:
  ingress:
  socify-internal:
    internal: true
