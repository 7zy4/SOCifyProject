worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client-body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 10m;
    client_body_timeout 30s;
    send_timeout 30s;
    server {
        listen 5000;
        # Operator metrics stay on the internal network: scrape socify:5000/health/metrics, never through the ingress.
        location ^~ /health/metrics {
            # NGINX answers this itself, so it sets the headers the application would have sent.
            default_type text/plain;
            add_header X-Content-Type-Options nosniff always;
            add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
            add_header Cache-Control no-store always;
            return 404;
        }
        # Static assets hold no per-user secret, so they are compressed; pages and API responses stay uncompressed
        # because compressing a body that mixes a secret token with reflected input leaks the token (BREACH).
        location ^~ /static/ {
            proxy_pass http://socify:5000;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 75s;
            gzip on;
            gzip_proxied any;
            gzip_vary on;
            gzip_min_length 1024;
            gzip_types text/css text/javascript application/javascript application/json image/svg+xml;
        }
        location / {
            proxy_pass http://socify:5000;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 75s;
            proxy_send_timeout 30s;
            proxy_request_buffering off;
            proxy_buffering off;
        }
    }
}
